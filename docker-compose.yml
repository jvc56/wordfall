# Local stack (PLAN.md § Development). Brought up by scripts/stack.py.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wordfall
      POSTGRES_PASSWORD: wordfall
      POSTGRES_DB: wordfall
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordfall -d wordfall"]
      interval: 1s
      timeout: 3s
      retries: 60

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: docker/backend.defaults.env
      - path: ${WORDFALL_ENV_FILE:-.stack/default.env}
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP_BUILD: ${WORDFALL_APP_BUILD:-0}
    ports:
      - "${WORDFALL_PORT:-5173}:80"
    depends_on:
      - backend

  # ./scripts/dev.py --hot-reload: the Vite dev server on :5174, proxying /api
  # through the stack's Nginx. No service worker here.
  vite:
    profiles: ["hot-reload"]
    image: node:22-bookworm-slim
    working_dir: /src/frontend
    command: sh -c "npm ci && npx vite dev --host 0.0.0.0 --port 5174"
    environment:
      WORDFALL_API: http://frontend:80
    volumes:
      - ./frontend:/src/frontend
      - ./contract-fixtures:/src/contract-fixtures
    ports:
      - "${WORDFALL_VITE_PORT:-5174}:5174"

volumes:
  pgdata:
